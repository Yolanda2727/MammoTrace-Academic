name: Auditoria tecnica MammoTrace
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KERAS_BACKEND: torch
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar perfil del repositorio
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.2 pytest-cov==7.0.0
      - name: Sintaxis y dependencias
        run: |
          python scripts/check_environment.py
          python -m compileall -q streamlit_app.py mammoapp mammotrace training scripts
      - name: Generar ejemplos sintéticos reproducibles
        run: python scripts/build_examples.py
      - name: Nucleo e inferencia disponible
        run: python -m pytest -p pytest_cov tests -q --junitxml=reports/ci_core.xml --cov=mammoapp --cov=mammotrace --cov-report=xml:reports/ci_coverage.xml
      - name: Interfaz nativa Streamlit AppTest
        run: python -m pytest tests_streamlit -q --junitxml=reports/ci_streamlit.xml
      - name: Conservar resultados tecnicos sin datos de usuarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-ci
          path: |
            reports/ci_core.xml
            reports/ci_streamlit.xml
            reports/ci_coverage.xml
